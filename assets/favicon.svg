<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Transparent background, aesthetic luxury monogram IB in white without border -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter I - Sleek, authoritative vertical architectural stroke with serif accents -->
    <path d="M150 110 H220 M185 110 V402 M150 402 H220" stroke="#FFFFFF" stroke-width="26" stroke-linecap="square"/>
    
    <!-- Distinct geometric & luxury accent dot -->
    <circle cx="185" cy="70" r="10" fill="#FFFFFF" stroke="none" />
    
    <!-- Letter B - Interlocking seamlessly with modern luxury curves -->
    <path d="M255 110 H345 C395 110, 415 150, 415 195 C415 240, 385 256, 345 256 H255 V110 Z" stroke="#FFFFFF" stroke-width="24" fill="none"/>
    <path d="M255 256 H360 C410 256, 425 300, 425 350 C425 402, 395 402, 360 402 H255 V256 Z" stroke="#FFFFFF" stroke-width="24" fill="none"/>

    <!-- Connecting luxury horizontal joinery line -->
    <line x1="185" y1="256" x2="255" y2="256" stroke="#FFFFFF" stroke-width="14" />
  </g>
</svg>